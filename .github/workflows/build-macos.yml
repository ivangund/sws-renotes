name: Build macOS

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture
        required: true
        type: choice
        default: arm64
        options:
          - arm64
          - x86_64

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 30
    env:
      ARCH: ${{ inputs.arch }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies
        run: brew install php

      - name: Configure
        run: |
          DEPLOY_TARGET=$( [ "$ARCH" = "arm64" ] && echo "11.0" || echo "10.13" )
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNO_INSTALL_PREFIX=YES \
            -DCMAKE_OSX_ARCHITECTURES=$ARCH \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$DEPLOY_TARGET

      - name: Build
        run: cmake --build build --parallel 1

      - name: Package
        working-directory: build
        run: cpack -G DragNDrop -C Release

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ inputs.arch }}
          path: build/sws-*.dmg
          if-no-files-found: error
